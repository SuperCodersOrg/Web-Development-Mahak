<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>
</head>

<body>
    <a href="/">Home</a>

    <h3 id="totalStudents"></h3>

    <h3>Active Batches</h3>

    <table border="2">
        <thead>
            <tr>
                <th>Batch</th>
                <th>Course</th>
                <th>Students</th>
            </tr>
        </thead>

        <tbody id="batches"></tbody>
    </table>

    <br>
    <table border="2">
        <thead>
            <tr>
                <th>Student Registration form</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><label for="id">Student id : </label>
                    <input id="id" placeholder="Enter your id" type="number">
                </td>
            </tr>
            <tr>
                <td><label for="name">Name : </label>
                    <input id="name" placeholder="Enter your name">
                </td>
            </tr>
            <tr>
                <td><label for="email">Email : </label>
                    <input id="email" placeholder="Enter your Email Id" type="email">
                </td>
            </tr>
            <tr>
                <td><label for="phone">Phone : </label>
                    <input id="phone" placeholder="Enter your Number">
                </td>
            </tr>
            <tr>
                <td><label for="course">Course : </label>
                    <input id="course" placeholder="Enter Course">
                </td>
            </tr>
            <tr>
                <td><label for="gender">Gender : </label>
                    <input id="gender" placeholder="Enter your Gender">
                </td>
            </tr>
            <tr>
                <td>
                    <button id="submit" type="submit">Submit</button>
                </td>
            </tr>

        </tbody>
    </table>


    <script>

        function fetchfun() {

            fetch('/students-data')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("HTTP error: " + response.status);
                    }

                    return response.json();
                })

                .then(data => {

                    console.log("Data received:", data);


                    document.getElementById('totalStudents').innerText =
                        `Total Students: ${data.summary.total_students}`;

                    let batchData = {};

                    data.students.forEach(student => {

                        let batch = student.batch;

                        if (!batchData[batch]) {

                            batchData[batch] = {
                                course: student.course,
                                students: 0
                            };

                        }

                        batchData[batch].students++;

                    });



                    document.getElementById('batches').innerHTML =
                        Object.keys(batchData).map(batch => {

                            return `
                            <tr>
                                <td>${batch}</td>
                                <td>${batchData[batch].course}</td>
                                <td>${batchData[batch].students}</td>
                            </tr>
                        `;

                        }).join('');

                })

                .catch(error => {
                    console.error("Fetch error:", error);
                });
        }

        let submit = document.getElementById('submit');
        let studentid = document.getElementById('id');
        let name = document.getElementById('name');
        let email = document.getElementById('email');
        let phone = document.getElementById('phone');
        let course = document.getElementById('course');
        let gender = document.getElementById('gender');


        submit.addEventListener("click", () => {
            let data = {
                "student_id": studentid.value,
                "name": name.value,
                "email": email.value,
                "phone": phone.value,
                "course": course.value,
                "batch": "2024-2028",
                "semester": 1,
                "year": 1,
                "gender": gender.value,

            };

            fetch('./students-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })

                .then(result => {
                    console.log(result);
                    studentid.value = "";
                    name.value = "";
                    email.value = "";
                    phone.value = "";
                    course.value = "";
                    gender.value = "";
                })




        })




        fetchfun();

    </script>

</body>

</html>
